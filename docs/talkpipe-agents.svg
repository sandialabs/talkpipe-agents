<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pipeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ee3c4"/>
      <stop offset="1" stop-color="#1f8fa8"/>
    </linearGradient>
    <linearGradient id="pipeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1ee3c4"/>
      <stop offset="1" stop-color="#1f8fa8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19476b"/>
      <stop offset="1" stop-color="#0d2b45"/>
    </linearGradient>
    <linearGradient id="chipEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee8cf"/>
      <stop offset="1" stop-color="#1a8ea6"/>
    </linearGradient>
  </defs>

  <!-- background: transparent (uncomment for dark fill)
  <rect width="512" height="512" fill="#0b1626"/>
  -->

  <!-- ===== left pipe bundle ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer slate band -->
    <path d="M0 150 H70 L120 200 H175" stroke="#2c4a63" stroke-width="22"/>
    <path d="M0 330 H70 L120 280 H175" stroke="#2c4a63" stroke-width="22"/>
    <!-- bright core bands -->
    <path d="M0 150 H70 L120 200 H175" stroke="url(#pipeL)" stroke-width="10"/>
    <path d="M0 330 H70 L120 280 H175" stroke="url(#pipeL)" stroke-width="10"/>
    <!-- middle rails -->
    <path d="M0 190 H90 L120 220 H175" stroke="#2c4a63" stroke-width="14"/>
    <path d="M0 290 H90 L120 260 H175" stroke="#2c4a63" stroke-width="14"/>
    <path d="M0 190 H90 L120 220 H175" stroke="#1f8fa8" stroke-width="5"/>
    <path d="M0 290 H90 L120 260 H175" stroke="#1f8fa8" stroke-width="5"/>
    <!-- center rail -->
    <path d="M0 240 H175" stroke="#2c4a63" stroke-width="18"/>
    <path d="M0 240 H175" stroke="#1ee3c4" stroke-width="7" opacity="0.9"/>
  </g>
  <!-- left chevrons -->
  <g fill="#9fe9df" opacity="0.85">
    <path d="M30 232 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M46 232 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M62 232 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M30 182 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M46 182 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M30 282 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M46 282 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
  </g>

  <!-- ===== right pipe bundle (mirror) ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 150 H442 L392 200 H337" stroke="#2c4a63" stroke-width="22"/>
    <path d="M512 330 H442 L392 280 H337" stroke="#2c4a63" stroke-width="22"/>
    <path d="M512 150 H442 L392 200 H337" stroke="url(#pipeR)" stroke-width="10"/>
    <path d="M512 330 H442 L392 280 H337" stroke="url(#pipeR)" stroke-width="10"/>
    <path d="M512 190 H422 L392 220 H337" stroke="#2c4a63" stroke-width="14"/>
    <path d="M512 290 H422 L392 260 H337" stroke="#2c4a63" stroke-width="14"/>
    <path d="M512 190 H422 L392 220 H337" stroke="#1f8fa8" stroke-width="5"/>
    <path d="M512 290 H422 L392 260 H337" stroke="#1f8fa8" stroke-width="5"/>
    <path d="M512 240 H337" stroke="#2c4a63" stroke-width="18"/>
    <path d="M512 240 H337" stroke="#1ee3c4" stroke-width="7" opacity="0.9"/>
  </g>
  <g fill="#9fe9df" opacity="0.85">
    <path d="M442 232 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M458 232 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M474 232 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M458 182 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M474 182 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M458 282 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
    <path d="M474 282 l8 8 -8 8 -4 0 8 -8 -8 -8z"/>
  </g>

  <!-- ===== chip ===== -->
  <!-- pins top/bottom -->
  <g stroke="#1f8fa8" stroke-width="7" stroke-linecap="round">
    <path d="M206 136 v-26 M226 136 v-26 M246 136 v-26 M266 136 v-26 M286 136 v-26 M306 136 v-26"/>
    <path d="M206 344 v26 M226 344 v26 M246 344 v26 M266 344 v26 M286 344 v26 M306 344 v26"/>
  </g>
  <!-- pins left/right -->
  <g stroke="#1f8fa8" stroke-width="7" stroke-linecap="round">
    <path d="M176 200 h-6 M176 220 h-6 M176 240 h-6 M176 260 h-6 M176 280 h-6"/>
    <path d="M336 200 h6 M336 220 h6 M336 240 h6 M336 260 h6 M336 280 h6"/>
  </g>
  <!-- body -->
  <rect x="176" y="140" width="160" height="200" rx="14" fill="url(#chipEdge)"/>
  <rect x="184" y="148" width="144" height="184" rx="10" fill="url(#chip)"/>
  <rect x="196" y="160" width="120" height="160" rx="8" fill="none" stroke="#1ee3c4" stroke-width="1.5" opacity="0.6"/>

  <!-- ===== inner icons: brain top-center, wrench + database bottom row ===== -->
  <g stroke="#2ee8cf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- brain: two symmetric lobes -->
    <path d="M256 174 c-6 -8 -18 -8 -22 2 c-10 -2 -16 8 -12 16 c-6 6 -2 16 6 18 c0 8 8 12 14 10 c4 6 10 6 14 2"/>
    <path d="M256 174 c6 -8 18 -8 22 2 c10 -2 16 8 12 16 c6 6 2 16 -6 18 c0 8 -8 12 -14 10 c-4 6 -10 6 -14 2"/>
    <path d="M256 174 v48"/>
    <!-- a few neural traces -->
    <path d="M236 196 h12 M276 196 h-12 M242 212 l8 -6 M270 212 l-8 -6"/>
  </g>
  <g fill="#2ee8cf">
    <circle cx="236" cy="196" r="2.6"/><circle cx="276" cy="196" r="2.6"/>
    <circle cx="242" cy="212" r="2.6"/><circle cx="270" cy="212" r="2.6"/>
  </g>

  <!-- wrench: single clean silhouette, 45° -->
  <g transform="translate(226 292) rotate(-45) scale(1.3)">
    <path fill="#2ee8cf"
          d="M-14 -3 h30 v6 h-30 z
             M16 -12 a12 12 0 1 1 0 24 a12 12 0 1 1 0 -24 z
             M12 -5 h8 v10 h-8 z"
          fill-rule="evenodd"/>
    <!-- open jaw notch -->
    <rect x="22" y="-4" width="10" height="8" fill="#0f3250" transform="rotate(0)"/>
  </g>

  <!-- database: three stacked discs, outline style to match brain -->
  <g fill="none" stroke="#2ee8cf" stroke-width="3.5" stroke-linecap="round">
    <ellipse cx="288" cy="266" rx="17" ry="6.5"/>
    <path d="M271 266 v14 a17 6.5 0 0 0 34 0 v-14"/>
    <path d="M271 280 v14 a17 6.5 0 0 0 34 0 v-14"/>
  </g>

  <!-- ===== wordmark ===== -->
  <text x="256" y="430" text-anchor="middle"
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-0.5">
    <tspan class="wm-a">TalkPipe</tspan><tspan class="wm-b">-Agents</tspan>
  </text>
  <style>
    /* Mid-tones that hold up on both white and dark pages */
    .wm-a { fill: #1f9fb5; }
    .wm-b { fill: #5f7a91; }
    /* Sharpen when the host page declares a scheme */
    @media (prefers-color-scheme: dark) {
      .wm-a { fill: #2ee8cf; }
      .wm-b { fill: #e6f1f5; }
    }
  </style>
</svg>
