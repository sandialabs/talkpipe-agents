version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "tlbauer2"
    assignees:
      - "tlbauer2"
    commit-message:
      prefix: "deps"
      prefix-development: "dev-deps"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "tlbauer2"
    assignees:
      - "tlbauer2"
    commit-message:
      prefix: "ci"
      include: "scope"
    # CodeQL refuses to run when its steps are on different versions, so
    # update all github/codeql-action steps in one PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
